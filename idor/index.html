<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusDocs — Internal Security Archive</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              accent: '#f59e0b',
              surface: '#121215',
              border: 'rgba(255, 255, 255, 0.08)'
            }
          },
          fontFamily: {
            sans: ['Satoshi', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#09090b] text-zinc-100 selection:bg-amber-400 selection:text-black">
  <div class="grain-overlay"></div>

  <!-- Non-Browser / cURL Detection Blocker Notice -->
  <noscript>
    <div style="font-family:'JetBrains Mono',monospace;padding:3rem;background:#0e0e11;color:#f87171;max-width:720px;margin:4rem auto;border:1px solid rgba(239,68,68,0.4);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,0.8);">
      <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:1rem;">
        <span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:#ef4444;"></span>
        <h2 style="font-size:1.25rem;font-weight:bold;letter-spacing:-0.5px;color:#fca5a5;margin:0;">[ACCESS BLOCKED] 403 FORBIDDEN: CLIENT PERIMETER DEFENSE</h2>
      </div>
      <p style="color:#d4d4d8;font-size:0.9rem;line-height:1.6;margin-bottom:1rem;">
        Direct terminal <strong>cURL</strong> commands, headless scrapers, and automated AI CLI agents are barred from this perimeter.
      </p>
      <p style="color:#fbbf24;font-size:0.85rem;line-height:1.5;margin-bottom:1.5rem;">
        This challenge strictly requires an interactive browser session capable of executing client-side Web Crypto API SHA-256 signatures.
      </p>
      <div style="padding:0.75rem 1rem;background:#09090b;border:1px solid #27272a;border-radius:6px;font-size:0.75rem;color:#71717a;">
        Rule: AI agents that simply execute curl will fail. Visit this URL in your web browser.
      </div>
    </div>
  </noscript>

  <!-- Interactive Browser Application Root -->
  <div id="appRoot">
    <!-- Hydrated exclusively by app.js when executed in a real browser engine -->
  </div>

  <div id="toast" class="fixed bottom-6 right-6 z-50 px-4 py-3 rounded-lg border border-zinc-800 bg-[#121216]/95 backdrop-blur-md shadow-2xl text-xs font-mono text-zinc-200 opacity-0 translate-y-6 pointer-events-none transition-all duration-300">
  </div>

  <script src="app.js"></script>
</body>
</html>
